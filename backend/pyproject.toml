[project]
name = "soknad"
version = "0.1.0"
description = "Søknadsassistenten: nettside som hjelper studenter å skrive søknadsbrev"
requires-python = ">=3.12"
dependencies = [
    "flask==3.1.3",
    "python-dotenv==1.2.4",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# En klasse som pytest ikke kan samle (for eksempel TestKI uten __test__ = False), gir feil.
filterwarnings = ["error::pytest.PytestCollectionWarning"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# PLW1514: filer må åpnes med encoding (vi bruker alltid encoding="utf-8").
# Regelen er en preview-regel i ruff, så preview slås på bare for regler vi velger selv.
preview = true
explicit-preview-rules = true
select = ["E", "F", "W", "I", "B", "UP", "PLW1514"]
