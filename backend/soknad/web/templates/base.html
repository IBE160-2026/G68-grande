<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block tittel %}{% endblock %} – {{ tekster.LOGO }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/stil.css') }}">
</head>
<body>
  <header class="topp">
    <p class="logo">{{ tekster.LOGO }}</p>
  </header>
  <main class="innhold">
    {% block innhold %}{% endblock %}
  </main>
  {#- Hjørneraden (corner-row): bare etter innlogging. KI-merknaden kommer til venstre i Epic 4. #}
  <footer class="bunn{% if innlogget %} hjornerad{% endif %}">
    {%- if innlogget %}
    <form class="utlogging" method="post" action="{{ url_for('web.logg_ut') }}">
      <button class="sekundaerknapp liten" type="submit">{{ tekster.LOGG_UT_KNAPP }}</button>
    </form>
    {%- endif %}
  </footer>
</body>
</html>
