# GitHub Actions: kjører automatisk hver gang kode lastes opp til GitHub.
# Resultatet vises under fanen "Actions" på GitHub (✅ eller ❌).
#
# Frontend- og backend-testene hopper over seg selv til mappene finnes:
#   frontend/package.json   -> JavaScript-testene starter
#   backend/pyproject.toml  -> Python-testene starter

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # gjør det mulig å starte manuelt fra Actions-fanen

jobs:
  prosjekt:
    name: Sjekk prosjektet
    runs-on: ubuntu-latest
    steps:
      - name: Hent koden
        uses: actions/checkout@v7

      - name: Sjekk at de viktigste filene finnes
        run: |
          test -f README.md
          test -f docs/product-brief.md
          echo "Prosjektstrukturen ser bra ut"

  frontend:
    name: Frontend (JavaScript)
    runs-on: ubuntu-latest
    steps:
      - name: Hent koden
        uses: actions/checkout@v7

      - name: Ingen frontend ennå
        if: hashFiles('frontend/package.json') == ''
        run: echo "::notice::Fant ingen frontend/package.json – hopper over frontend-testene."

      - name: Installer Node.js
        if: hashFiles('frontend/package.json') != ''
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Installer pakker
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: npm install

      - name: Kjør testene
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: npm test --if-present

  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Hent koden
        uses: actions/checkout@v7

      - name: Ingen backend ennå
        if: hashFiles('backend/pyproject.toml') == ''
        run: echo "::notice::Fant ingen backend/pyproject.toml – hopper over backend-testene."

      - name: Installer UV
        if: hashFiles('backend/pyproject.toml') != ''
        uses: astral-sh/setup-uv@v10.2.0

      - name: Installer pakker
        if: hashFiles('backend/pyproject.toml') != ''
        working-directory: backend
        run: uv sync

      - name: Kjør testene
        if: hashFiles('backend/tests/**/*.py') != ''
        working-directory: backend
        run: uv run --with pytest pytest